name: Desktop builds

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate web assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  package:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
            artifacts: |
              release/*.dmg
              release/*.zip
          - name: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifacts: |
              release/*.dmg
              release/*.zip
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
            artifacts: |
              release/*.exe
              release/*.zip
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            artifacts: |
              release/*.AppImage
              release/*.deb
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifacts: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package Electron application
        run: npm run desktop:package:${{ matrix.platform }} -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: retivum-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
